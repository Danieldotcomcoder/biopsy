[package]
name = "biopsy"
version = "0.1.0"
edition = "2024"
description = "Learn model file formats by inspecting their raw bytes"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
